name: ci

on:
  push:          # every branch, so feature branches get checked before a PR
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: lint
        run: make lint
      - name: typecheck
        run: make typecheck
      - name: unit tests
        run: make test

  integration:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongodb/mongodb-atlas-local:latest
        ports: ["27017:27017"]
        options: >-
          --health-cmd "/usr/local/bin/runner healthcheck"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      MONGODB_URI: mongodb://localhost:27017/?directConnection=true
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-${{ hashFiles('config/base.yaml') }}
      - name: integration tests
        shell: bash  # explicit bash enables pipefail, so a pytest failure fails the step
        run: uv run pytest -m integration -s -q -rfEs | tee pytest.log  # -s prints timings
      - name: publish results as annotations (logs need sign-in; annotations do not)
        if: always()
        run: |
          grep -E "ready in|bytes per chunk|re-rank 20 pairs|passed|failed|skipped" pytest.log | sed 's/^/::notice::/' || true
          grep -E "^(FAILED|ERROR) " pytest.log | cut -c1-900 | sed 's/^/::error::/' || true
