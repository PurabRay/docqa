name: ci

on:
  push:          # every branch, so feature branches get checked before a PR
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: lint
        run: make lint
      - name: typecheck
        run: make typecheck
      - name: unit tests
        run: make test

  integration:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongodb/mongodb-atlas-local:latest
        ports: ["27017:27017"]
        options: >-
          --health-cmd "/usr/local/bin/runner healthcheck"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      MONGODB_URI: mongodb://localhost:27017/?directConnection=true
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-${{ hashFiles('config/base.yaml') }}
      - name: integration and e2e tests
        shell: bash  # explicit bash enables pipefail, so a pytest failure fails the step
        run: uv run pytest -m "integration or e2e" -s -q -rfEsx | tee pytest.log  # -s prints timings
      - name: publish results as annotations (logs need sign-in; annotations do not)
        if: always()
        run: |
          grep -E "ready in|bytes per chunk|re-rank 20 pairs|passed|failed|skipped" pytest.log | sed 's/^/::notice::/' || true
          grep -E "^(FAILED|ERROR|XFAIL) " pytest.log | cut -c1-900 | sed 's/^/::error::/' || true

  load:
    # Stub load test (PRD: >= 2 queries/s at 8 users, < 1% errors, peak ops/s well under 60).
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongodb/mongodb-atlas-local:latest
        ports: ["27017:27017"]
        options: >-
          --health-cmd "/usr/local/bin/runner healthcheck"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      MONGODB_URI: mongodb://localhost:27017/?directConnection=true
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
      DOCQA_PROFILE: loadtest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-${{ hashFiles('config/base.yaml') }}
      - run: uv run python scripts/init_db.py
      - name: start the API
        run: |
          nohup uv run uvicorn docqa.api.app:create_app --factory --port 8000 > api.log 2>&1 &
          for i in $(seq 1 120); do curl -sf localhost:8000/health && break; sleep 2; done
      - name: locust, 8 users, 2 minutes
        shell: bash
        run: uv run locust -f scripts/locustfile.py --headless -u 8 -r 8 -t 2m --host http://localhost:8000 --mode stub --only-summary
      - name: publish load numbers
        if: always()
        run: python -c "import json;r=json.load(open('eval/reports/load-stub.json'));print('::notice::load-stub '+json.dumps(r))" || true
