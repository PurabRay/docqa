name: release

# Build the one image (API or UI) and push it tagged with the commit SHA (PRD: deployment).
# Rollback = redeploy the previous SHA tag; see docs/runbooks/deploy.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/docqa:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/docqa:latest
