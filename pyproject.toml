[project]
name = "docqa"
version = "0.1.0"
description = "Retrieval-augmented question answering over your PDFs, with page-level citations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "pymongo>=4.13",
    "httpx>=0.27",
    "openai>=1.40",
    "fastembed>=0.4",
    "pymupdf>=1.24",
    "pymupdf4llm>=0.0.17",
    "pdfplumber>=0.11",
    "tiktoken>=0.7",
    "chonkie>=1.0",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "structlog>=24.1",
    "langfuse>=3.0",
    "streamlit>=1.38",
    "streamlit-pdf-viewer>=0.0.20",
    "tenacity>=9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    "testcontainers>=4.8",
    "locust>=2.31",
    "ragas>=0.2",
    "rank-bm25>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docqa"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "D", "RUF"]
ignore = [
    "D104",  # package __init__ files need no docstring
    "D105",  # magic methods
    "D107",  # __init__ is documented on the class
]

[tool.ruff.lint.isort]
known-first-party = ["docqa", "tests"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
files = ["src", "scripts"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["docqa.domain.*", "docqa.ports.*", "docqa.services.*"]
strict = true

# PDF libraries ship partial or no type hints; treat them as untyped.
[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*", "pymupdf4llm", "pymupdf4llm.*", "pdfplumber", "pdfplumber.*"]
ignore_missing_imports = true
follow_imports = "skip"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets tests import tests.fixtures.make_fixtures
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"
markers = [
    "unit: pure logic; no network, no Docker",
    "integration: needs the mongodb/mongodb-atlas-local container",
    "e2e: API + UI client end to end with the stub LLM",
    "eval: golden-set evaluation (uses real providers)",
    "live: calls a real hosted provider",
    "slow: takes more than a few seconds",
]
